<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Reino Encantado</title>
<meta name="description" content="Jogo de cores, números e memória para crianças de 3 a 5 anos.">
<meta name="theme-color" content="#2E2350">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icones/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/estilo.css">
</head>
<body>
<div id="ceu" aria-hidden="true"></div>

<main id="app">

  <!-- ============ MUNDOS ============ -->
  <section id="tela-mundos" class="tela">
    <h1 id="titulo"><b>Reino Encantado</b><i>escolha um lugar</i></h1>
    <div id="lista-mundos"></div>
    <div id="lista-ocasioes" hidden></div>
    <button id="btn-vestir" class="barra-baixo">
      <em aria-hidden="true"></em><span>Vestir</span><small id="contador-colecao"></small>
    </button>
  </section>

  <!-- ============ FASES ============ -->
  <section id="tela-fases" class="tela" hidden>
    <header class="topo">
      <button id="voltar-fases" class="circ" aria-label="Voltar" data-icone="seta"></button>
      <h2 id="nome-mundo"></h2>
      <span class="circ vazio" aria-hidden="true"></span>
    </header>
    <div id="lista-fases"></div>
  </section>

  <!-- ============ JOGO ============ -->
  <section id="tela-jogo" class="tela" hidden>
    <header class="topo">
      <button id="sair-jogo" class="circ" aria-label="Sair da fase" data-icone="seta"></button>
      <div class="topo-centro">
        <h2 id="titulo-fase"></h2>
        <div id="pontos-rodada" class="pontos"></div>
      </div>
      <button id="repetir" class="circ" aria-label="Ouvir de novo" data-icone="som"></button>
    </header>
    <div id="coracoes" class="coracoes" hidden></div>
    <div id="ampulheta"><div id="areia"></div></div>
    <div id="palco"></div>
    <p id="pergunta"><span id="pergunta-texto"></span></p>
  </section>

  <!-- ============ PRÊMIO ============ -->
  <section id="tela-premio" class="tela" hidden>
    <h2 id="premio-titulo"></h2>
    <div id="premio-desenho"></div>
    <p id="premio-nome"></p>
    <p id="premio-selo"></p>
    <button id="premio-continuar" class="botao-grande">Continuar</button>
  </section>

  <!-- ============ GUARDA-ROUPA ============ -->
  <section id="tela-guarda-roupa" class="tela" hidden>
    <header class="topo">
      <button id="voltar-guarda-roupa" class="circ" aria-label="Voltar" data-icone="seta"></button>
      <h2>Vestir</h2>
      <span class="circ vazio" aria-hidden="true"></span>
    </header>
    <div id="provador">
      <button id="btn-estabulo" aria-label="Escolher unicórnio"></button>
      <div id="provador-princesa"></div>
      <div id="paleta" aria-label="Cores"></div>
    </div>
    <div id="pecas"></div>
    <button id="btn-zerar" class="link-discreto">Começar tudo de novo</button>
  </section>

  <!-- ============ ESTÁBULO ============ -->
  <section id="tela-estabulo" class="tela" hidden>
    <header class="topo">
      <button id="voltar-estabulo" class="circ" aria-label="Voltar" data-icone="seta"></button>
      <h2>Quem vai junto?</h2>
      <span class="circ vazio" aria-hidden="true"></span>
    </header>
    <div id="grade-estabulo"></div>
  </section>

  <!-- ============ OCASIÃO ============ -->
  <section id="tela-ocasiao" class="tela" hidden>
    <header class="topo">
      <button id="voltar-ocasiao" class="circ" aria-label="Voltar" data-icone="seta"></button>
      <h2 id="nome-ocasiao"></h2>
      <span class="circ vazio" aria-hidden="true"></span>
    </header>
    <div id="ocasiao-cena"></div>
    <button id="ocasiao-vestir" class="botao-grande">Trocar de roupa</button>
  </section>

</main>

<div id="festa" aria-hidden="true"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
